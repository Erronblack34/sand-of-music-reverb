name: Sand of Music Reverb - Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and configure Android SDK
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK: $SDK_ROOT"

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found"
            find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f
            exit 1
          fi

          echo "Found sdkmanager: $SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          "$SDKMANAGER" --version
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses < <(yes)
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q SandOfMusicReverb-v0.3.0-mobile.zip
          test -f SandOfMusicReverb-v0.3.0/settings.gradle.kts

      - name: Build debug APK
        working-directory: SandOfMusicReverb-v0.3.0
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sand-of-Music-Reverb-v0.3.0-APK
          path: SandOfMusicReverb-v0.3.0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
