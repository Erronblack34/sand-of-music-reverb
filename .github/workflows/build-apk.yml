
name: Sand of Music Reverb - Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify and extract v0.3.0 source
        run: |
          set -e
          test -f SandOfMusicReverb-v0.3.0-mobile.zip
          unzip -t SandOfMusicReverb-v0.3.0-mobile.zip
          unzip -q SandOfMusicReverb-v0.3.0-mobile.zip
          test -f SandOfMusicReverb-v0.3.0/settings.gradle.kts

      - name: Build debug APK
        working-directory: SandOfMusicReverb-v0.3.0
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sand-of-Music-Reverb-v0.3.0-APK
          path: SandOfMusicReverb-v0.3.0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
