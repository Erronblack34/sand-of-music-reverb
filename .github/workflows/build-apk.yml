
name: Sand of Music Reverb - Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          sdkmanager --version

      - name: Accept licenses and install SDK
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q SandOfMusicReverb-v0.2.0-mobile.zip
          test -f SandOfMusicReverb-v0.2.0/settings.gradle.kts

      - name: Build debug APK
        working-directory: SandOfMusicReverb-v0.2.0
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sand-of-Music-Reverb-APK
          path: SandOfMusicReverb-v0.2.0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
