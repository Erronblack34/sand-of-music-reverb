name: Sand of Music Reverb - Android APK v1.25

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify source archive and exact paths
        run: |
          set -euo pipefail
          ARCHIVE="Sand_of_Music_Reverb_v1.25.zip"
          PROJECT="SandOfMusicReverb-v1.25"
          test -f "$ARCHIVE"
          unzip -t "$ARCHIVE"
          unzip -q "$ARCHIVE"
          test -f "$PROJECT/settings.gradle.kts"
          test -f "$PROJECT/app/build.gradle.kts"
          test -f "$PROJECT/app/src/main/java/com/sandofmusic/reverb/MainActivity.kt"
          test -f "$PROJECT/app/src/main/java/com/sandofmusic/reverb/MediaPipeline.kt"
          test -f "$PROJECT/app/src/main/java/com/sandofmusic/reverb/AudioRenderWorker.kt"
          test -f "$PROJECT/app/src/main/java/com/sandofmusic/reverb/StemSplitWorker.kt"
          test -f "$PROJECT/app/src/main/java/com/sandofmusic/reverb/WaveformView.kt"
          test -f "$PROJECT/app/src/main/java/com/sandofmusic/reverb/SpectrumVisualizerView.kt"
          grep -q 'versionCode = 125' "$PROJECT/app/build.gradle.kts"
          grep -q 'versionName = "1.25"' "$PROJECT/app/build.gradle.kts"

      - name: Run source feature checks
        working-directory: SandOfMusicReverb-v1.25
        run: |
          python3 tools/v125_feature_smoke_test.py

      - name: Build debug APK
        working-directory: SandOfMusicReverb-v1.25
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Rename APK for sharing
        run: |
          set -euo pipefail
          mkdir -p dist
          cp SandOfMusicReverb-v1.25/app/build/outputs/apk/debug/app-debug.apk dist/SandOfMusicReverb_v1.25.apk
          test -s dist/SandOfMusicReverb_v1.25.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sand-of-Music-Reverb-v1.25-APK
          path: dist/SandOfMusicReverb_v1.25.apk
          if-no-files-found: error
          retention-days: 14