
name: Sand of Music Reverb - Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK v0.6.5
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify and extract v0.6.5 source
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="SandOfMusicReverb-v0.6.5.zip"
          PROJECT="SandOfMusicReverb-v0.6.5"

          echo "Repository root:"
          pwd
          ls -lah

          if [ ! -f "$ARCHIVE" ]; then
            echo "::error::Archive not found at repository root: $ARCHIVE"
            exit 1
          fi

          echo "Checking archive integrity..."
          unzip -t "$ARCHIVE"

          echo "Archive contents:"
          unzip -Z1 "$ARCHIVE" | head -80

          unzip -q "$ARCHIVE"

          for file in \
            "$PROJECT/settings.gradle.kts" \
            "$PROJECT/app/build.gradle.kts" \
            "$PROJECT/app/src/main/AndroidManifest.xml" \
            "$PROJECT/app/src/main/java/com/sandofmusic/reverb/MainActivity.kt" \
            "$PROJECT/app/src/main/java/com/sandofmusic/reverb/MediaPipeline.kt" \
            "$PROJECT/app/src/main/java/com/sandofmusic/reverb/AudioRenderWorker.kt"; do
            if [ ! -f "$file" ]; then
              echo "::error::Required project file missing: $file"
              echo "Extracted project tree:"
              find "$PROJECT" -maxdepth 6 -type f | sort | head -120 || true
              exit 1
            fi
          done

          echo "Source archive verified successfully."

      - name: Build debug APK
        working-directory: SandOfMusicReverb-v0.6.5
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sand-of-Music-Reverb-v0.6.5-APK
          path: SandOfMusicReverb-v0.6.5/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
 