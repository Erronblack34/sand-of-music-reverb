
name: Sand of Music Reverb - Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify and extract v0.3.0 source
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "SandOfMusicReverb-v0.3.0-clean.zip" ]; then
            ARCHIVE="SandOfMusicReverb-v0.3.0-clean.zip"
          elif [ -f "SandOfMusicReverb-v0.3.0-mobile.zip" ]; then
            ARCHIVE="SandOfMusicReverb-v0.3.0-mobile.zip"
          else
            echo "::error::Version 0.3.0 source archive not found"
            ls -lah
            exit 1
          fi

          echo "Using archive: $ARCHIVE"
          unzip -t "$ARCHIVE"
          unzip -q "$ARCHIVE"

          test -f "SandOfMusicReverb-v0.3.0/settings.gradle.kts"
          test -f "SandOfMusicReverb-v0.3.0/app/src/main/java/com/sandofmusic/reverb/MainActivity.kt"

      - name: Fix Kotlin source
        shell: bash
        run: |
          set -euo pipefail

          FILE="SandOfMusicReverb-v0.3.0/app/src/main/java/com/sandofmusic/reverb/MainActivity.kt"

          sed -i 's/singleLine = true/setSingleLine(true)/g' "$FILE"

          if grep -n "singleLine = true" "$FILE"; then
            echo "::error::Kotlin singleLine issue was not fixed"
            exit 1
          fi

          echo "Kotlin source patch checked successfully"

      - name: Build debug APK
        working-directory: SandOfMusicReverb-v0.3.0
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sand-of-Music-Reverb-v0.3.0-APK
          path: SandOfMusicReverb-v0.3.0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
