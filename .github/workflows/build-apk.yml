name: Sand of Music Reverb - Android APK v0.9.0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify source archive
        run: |
          set -euo pipefail
          ARCHIVE="SandOfMusicReverb-v0.9.0.zip"
          PROJECT="SandOfMusicReverb-v0.9.0"
          test -f "$ARCHIVE"
          unzip -t "$ARCHIVE"
          unzip -q "$ARCHIVE"
          test -f "$PROJECT/settings.gradle.kts"
          test -f "$PROJECT/app/src/main/java/com/sandofmusic/reverb/MainActivity.kt"
          test -f "$PROJECT/app/src/main/java/com/sandofmusic/reverb/GenreStyleProfiles.kt"

      - name: Build debug APK
        working-directory: SandOfMusicReverb-v0.9.0
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sand-of-Music-Reverb-v0.9.0-APK
          path: SandOfMusicReverb-v0.9.0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14 